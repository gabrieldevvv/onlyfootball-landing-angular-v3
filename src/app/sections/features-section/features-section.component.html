<section id="funkcje" class="features-section">
  <div class="container">
    <div class="section-heading">
      <span class="eyebrow">Funkcje platformy</span>
      <h2>Wszystko, czego potrzebujesz, aby prowadzić piłkarską społeczność online.</h2>
      <p>
        Dołącz do nas i zacznij budować swoją piłkarską społeczność online!
      </p>
    </div>

    <div class="features-grid">
      @for (feature of features; track feature.title) {
        <article class="feature-card glass-card">
          <span>{{ feature.tag }}</span>
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
